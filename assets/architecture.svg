<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-label="neighwatch architecture pipeline">
  <defs>
    <pattern id="arch-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect x="1" y="1" width="838" height="378" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="2" y="34" width="836" height="343" fill="url(#arch-grid)" opacity="0.5"/>

  <!-- Window Header -->
  <line x1="1" y1="34" x2="839" y2="34" stroke="#21262d" stroke-width="1"/>
  <circle cx="20" cy="17" r="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <circle cx="34" cy="17" r="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <circle cx="48" cy="17" r="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="820" y="21" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#6e7681">architecture.pipeline // neighwatch v0.1.0.dev0</text>

  <!-- Stage 1: Capture & Ingestion Layer -->
  <g transform="translate(24, 48)">
    <rect x="0" y="0" width="792" height="62" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="14" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#8b949e">1. INGESTION LAYER</text>

    <!-- Source Box A: Linux AF_PACKET -->
    <rect x="14" y="28" width="180" height="24" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="104" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#3fb950">AF_PACKET (Linux Raw)</text>

    <!-- Source Box B: Windows Scapy/Npcap -->
    <rect x="206" y="28" width="180" height="24" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="296" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#58a6ff">Npcap / conf.L2listen</text>

    <!-- Source Box C: Classic .pcap -->
    <rect x="398" y="28" width="186" height="24" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="491" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#e6edf3">Classic .pcap (LE / BE)</text>

    <!-- Source Box D: PCAPNG -->
    <rect x="596" y="28" width="182" height="24" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="687" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#e6edf3">PCAPNG (SHB / IDB / EPB)</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <line x1="420" y1="110" x2="420" y2="128" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Wire Framing & Protocol Decoder -->
  <g transform="translate(24, 130)">
    <rect x="0" y="0" width="792" height="72" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="14" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#8b949e">2. WIRE DECODER (neighwatch.parser)</text>

    <!-- Block 2A: LinkType -->
    <rect x="14" y="28" width="170" height="34" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="99" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#e6edf3">LinkType Validation</text>
    <text x="99" y="56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#8b949e">DLT_EN10MB (Type 1)</text>

    <!-- Block 2B: 802.1Q Unwrapping -->
    <rect x="196" y="28" width="180" height="34" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="286" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#e6edf3">802.1Q / 802.1ad VLAN</text>
    <text x="286" y="56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#8b949e">Unwraps stacked tags</text>

    <!-- Block 2C: ARP Parsing -->
    <rect x="388" y="28" width="200" height="34" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="488" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#3fb950">28-Byte ARP Header</text>
    <text x="488" y="56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#8b949e">struct.unpack_from "!HHBBH..."</text>

    <!-- Block 2D: Padding Truncation -->
    <rect x="600" y="28" width="178" height="34" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="689" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#e6edf3">60-Byte Frame Padding</text>
    <text x="689" y="56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#8b949e">Ignores trailing zero pad</text>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <line x1="420" y1="202" x2="420" y2="220" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: State Tracking & Threat Analysis Engine -->
  <g transform="translate(24, 222)">
    <rect x="0" y="0" width="792" height="76" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="14" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#8b949e">3. STATE TRACKER &amp; INVARIANT CHECKS (neighwatch.table + window)</text>

    <!-- Submodule 3A: Invariant Verification -->
    <rect x="14" y="28" width="220" height="38" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#f85149">RFC 5227 (0.0.0.0 probe)</text>
    <text x="24" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#f85149">HW Check: eth_src == sha</text>

    <!-- Submodule 3B: Binding Table -->
    <rect x="246" y="28" width="260" height="38" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="376" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#58a6ff">NeighborTable (IP -&gt; MAC)</text>
    <text x="376" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#8b949e">first_seen / last_seen / MAC flip alert</text>

    <!-- Submodule 3C: Flood Window & TTL -->
    <rect x="518" y="28" width="260" height="38" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="648" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#3fb950">SlidingWindowCounter</text>
    <text x="648" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#8b949e">GARP rate limits + packet-ts TTL eviction</text>
  </g>

  <!-- Flow Connector 3 -> 4 -->
  <line x1="420" y1="298" x2="420" y2="314" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Stage 4: Output & Structured Telemetry Stream -->
  <g transform="translate(24, 316)">
    <rect x="0" y="0" width="792" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="14" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#8b949e">4. TELEMETRY</text>

    <!-- Telemetry Output Badges -->
    <rect x="130" y="11" width="150" height="24" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
    <text x="205" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#3fb950">JSONL Stream (stdout)</text>

    <rect x="292" y="11" width="150" height="24" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="367" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#e6edf3">Atomic state.json</text>

    <rect x="454" y="11" width="160" height="24" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
    <text x="534" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#58a6ff">journald / systemd</text>

    <rect x="626" y="11" width="152" height="24" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="702" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#8b949e">SIEM / jq pipelines</text>
  </g>
</svg>
