<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="neighwatch logo">
  <defs>
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#58a6ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="link-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="link-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="252" height="252" rx="28" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Radar / Monitor Glow -->
  <circle cx="128" cy="128" r="96" fill="url(#radar-glow)"/>

  <!-- Concentric Scan Rings -->
  <circle cx="128" cy="128" r="36" fill="none" stroke="#21262d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="128" cy="128" r="68" fill="none" stroke="#21262d" stroke-width="1.5"/>
  <circle cx="128" cy="128" r="96" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Crosshair Reticles -->
  <line x1="128" y1="20" x2="128" y2="40" stroke="#30363d" stroke-width="1.5"/>
  <line x1="128" y1="216" x2="128" y2="236" stroke="#30363d" stroke-width="1.5"/>
  <line x1="20" y1="128" x2="40" y2="128" stroke="#30363d" stroke-width="1.5"/>
  <line x1="216" y1="128" x2="236" y2="128" stroke="#30363d" stroke-width="1.5"/>

  <!-- Topology Links (L2 Neighbor Mesh) -->
  <line x1="128" y1="128" x2="72" y2="76" stroke="url(#link-grad-1)" stroke-width="2"/>
  <line x1="128" y1="128" x2="184" y2="82" stroke="url(#link-grad-2)" stroke-width="2"/>
  <line x1="128" y1="128" x2="176" y2="182" stroke="#21262d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="128" y1="128" x2="78" y2="178" stroke="url(#link-grad-1)" stroke-width="2"/>

  <!-- Neighbor Nodes -->
  <!-- Node A (Learned) -->
  <circle cx="72" cy="76" r="9" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <circle cx="72" cy="76" r="3.5" fill="#3fb950"/>

  <!-- Node B (Verified) -->
  <circle cx="184" cy="82" r="9" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="184" cy="82" r="3.5" fill="#58a6ff"/>

  <!-- Node C (Monitored) -->
  <circle cx="176" cy="182" r="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <circle cx="176" cy="182" r="3" fill="#8b949e"/>

  <!-- Node D (Target) -->
  <circle cx="78" cy="178" r="9" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <circle cx="78" cy="178" r="3.5" fill="#3fb950"/>

  <!-- Center Sentinel Node (neighwatch Daemon) -->
  <circle cx="128" cy="128" r="15" fill="#161b22" stroke="#f0f6fc" stroke-width="2.5"/>
  <circle cx="128" cy="128" r="6" fill="#3fb950"/>

  <!-- Corner Monospace Badge -->
  <rect x="22" y="210" width="46" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="45" y="225" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#58a6ff">L2</text>
</svg>
